<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Box 🎮</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 20px;
            margin: 15px;
        }

        #gameArea {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 500px;
            margin: 20px auto;
            background: #1f2937;
            border: 3px solid #374151;
            border-radius: 15px;
            overflow: hidden;
        }

        #box {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #22c55e;
            border-radius: 10px;
            cursor: pointer;
            display: none;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #message {
            font-size: 22px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>🎮 Catch the Box</h1>

    <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
    </div>

    <button onclick="startGame()">Start Game</button>

    <div id="message">Press Start Game!</div>

    <div id="gameArea">
        <div id="box"></div>
    </div>

    <script>
        let score = 0;
        let time = 60;
        let timer;
        let gameRunning = false;

        const box = document.getElementById("box");
        const gameArea = document.getElementById("gameArea");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const message = document.getElementById("message");

        function startGame() {
            score = 0;
            time = 60;
            gameRunning = true;

            scoreText.textContent = score;
            timeText.textContent = time;
            message.textContent = "Click the green box!";

            box.style.display = "block";

            moveBox();

            clearInterval(timer);

            timer = setInterval(() => {
                time--;
                timeText.textContent = time;

                if (time <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function moveBox() {
            const maxX = gameArea.clientWidth - box.offsetWidth;
            const maxY = gameArea.clientHeight - box.offsetHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            box.style.left = x + "px";
            box.style.top = y + "px";
        }

        box.addEventListener("click", () => {
            if (!gameRunning) return;

            score++;
            scoreText.textContent = score;

            moveBox();
        });

        function endGame() {
            gameRunning = false;

            clearInterval(timer);

            box.style.display = "none";

            message.textContent = "🎉 Game Over! Your score: " + score;
        }
    </script>

</body>
</html>
